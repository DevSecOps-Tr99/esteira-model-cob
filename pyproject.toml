[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esteira-model-cob"
version = "0.2.0"
description = "POC de esteira CI/CD para JCL/COBOL com GitHub Actions e um motor de esteira em Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
esteira-model-cob = "esteira_model_cob.cli:main"

[tool.setuptools.packages.find]
include = ["esteira_model_cob*"]
