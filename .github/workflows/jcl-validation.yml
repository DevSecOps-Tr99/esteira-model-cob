name: JCL Pipeline

on:
  pull_request:
    paths:
      - "jcl/**"
      - "proc/**"
      - "cobol/**"
      - "config/**"
      - "esteira_model_cob/**"
      - "tools/proleap-runner/**"
      - "tests/**"
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  # Seletor de publicacao: escolhe o ambiente na hora de rodar. TI e PRD
  # param para aprovacao (GitHub Environments) antes do job deploy.
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente de destino"
        type: choice
        options: [TU, TI, PRD]
        default: TU
      jcl:
        description: "JCL modelo a publicar"
        type: string
        default: jcl/ESTMX001.jcl

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 (historico completo) - o gitleaks-action faz um git
      # log entre o "before" e o "after" SHA do push; num checkout raso
      # (padrao, 1 commit) ele nao consegue resolver esse range quando o
      # push traz um merge com historico mais longo (ex.: release -> main).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar a esteira
        run: pip install -e ".[dev]"

      - name: Gitleaks - scan de segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java (para o wrapper do ProLeap)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # proleap-cobol-parser nao e publicado no Maven Central em nenhuma
      # versao - precisa ser compilado da fonte antes do pytest/mvn
      # conseguirem resolve-lo. Ver scripts/install_proleap.sh.
      - name: Instalar proleap-cobol-parser (nao esta no Maven Central)
        run: bash scripts/install_proleap.sh

      - name: Testes (pytest)
        run: pytest -q

      # continue-on-error: os 3 JCLs de demonstracao incluem de proposito um
      # cenario bloqueado (poc003) - o pytest acima ja testa esse bloqueio
      # via assert; estes dois passos sao a saida "ao vivo" da demo descrita
      # em docs/poc-demo.md, nao o gate de saude do repositorio.
      - name: Validar JCLs (Rules Engine + Quality Gate)
        continue-on-error: true
        run: python -m esteira_model_cob validate jcl/

      # poc005 tem um placeholder ${SPACE_PRIMARY}/${SPACE_SECONDARY} -
      # esteira_model_cob/templating.py + config/jcl_env_params.yml
      # renderizam um valor por ambiente (achado testando contra JCL real -
      # ver docs/jcl-parametros-por-ambiente.md). O passo acima ja validou
      # com --env default (TU); este mostra o mesmo job renderizado para PRD.
      - name: Validar JCL com parametro por ambiente (--env PRD)
        continue-on-error: true
        run: python -m esteira_model_cob validate jcl/poc005_por_ambiente.jcl --env PRD

      - name: Simular submissao (MockZosAdapter)
        continue-on-error: true
        run: python -m esteira_model_cob simulate jcl/

      # tests/fixtures/*.bin sao bytes EBCDIC (cp037) - uma fixture limpa e
      # uma com bytes de controle hard-coded (achado da esteira Endevor
      # real - ver docs/reuniao-endevor-jcl-binarios.md). continue-on-error
      # porque a fixture "hex_declarado" e reprovada por design (pytest ja
      # cobre isso via assert; isto e a saida "ao vivo" da demo).
      - name: Binary guard - massa de teste EBCDIC (jcl/proc reais nao tem hoje)
        continue-on-error: true
        run: python -m esteira_model_cob binary-guard tests/fixtures/

      - name: Gerar JCL Pipeline Report
        if: always()
        run: |
          for jcl in jcl/*.jcl; do
            python -m esteira_model_cob report "$jcl"
          done

      - name: Upload dos relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jcl-pipeline-reports
          path: reports/

  # Publicacao no ambiente da POC na Azure (docs/ambiente-poc-azure.md),
  # no mesmo padrao da esteira corporativa para Linux: azure/login com o
  # JSON do SPN, credenciais lidas do Key Vault pelo nome guardado nas
  # variables G_DEPLOYMENT_TARGET_LINUX_<ENV>_*, SSH no servidor de
  # destino. Roda no runner self-hosted da mesma VNet do destino.
  #
  # Ambiente: o seletor do workflow_dispatch ou, em push, o mapeamento
  # branch -> ambiente do docs/gitflow.md. TI e PRD esperam aprovacao do
  # GitHub Environment antes do primeiro passo.
  deploy:
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, estm-runner]
    environment: >-
      ${{
        inputs.ambiente
        || github.ref_name == 'main' && 'PRD'
        || startsWith(github.ref_name, 'release/') && 'TI'
        || startsWith(github.ref_name, 'hotfix/') && 'PRD'
        || 'TU'
      }}
    env:
      ESTM_ENV: >-
        ${{
          inputs.ambiente
          || github.ref_name == 'main' && 'PRD'
          || startsWith(github.ref_name, 'release/') && 'TI'
          || startsWith(github.ref_name, 'hotfix/') && 'PRD'
          || 'TU'
        }}
      ESTM_JCL: ${{ inputs.jcl || 'jcl/ESTMX001.jcl' }}
      # So as variables JCL_* viram parametro de JCL (templating.py).
      ESTM_GITHUB_VARS: ${{ toJSON(vars) }}

    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 marca o Python do sistema como "externally managed"
      # (PEP 668) - uma venv dedicada para o resto do job.
      - name: Preparar ambiente Python (venv)
        run: |
          python3 -m venv "$HOME/.venvs/esteira-model-cob"
          echo "$HOME/.venvs/esteira-model-cob/bin" >> "$GITHUB_PATH"

      - name: Instalar a esteira
        run: pip install -q -e .

      - name: Renderizar JCL para ${{ env.ESTM_ENV }}
        id: render
        run: python -m esteira_model_cob render "$ESTM_JCL" --env "$ESTM_ENV" --out build

      - name: Quality/Security Gate no JCL final
        run: python -m esteira_model_cob validate ${{ steps.render.outputs.arquivos }} --env "$ESTM_ENV"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.SPN_KV_DEV_SECRET }}
          allow-no-subscriptions: true

      - name: Key Vault - credenciais de ${{ env.ESTM_ENV }}
        run: >-
          python -m esteira_model_cob kv-fetch
          --vault "${{ vars.GH_KV_DEV }}"
          --secret "ssh-key=${{ vars[format('G_DEPLOYMENT_TARGET_LINUX_{0}_KEY', env.ESTM_ENV)] }}"
          --secret "token=${{ vars[format('G_DEPLOYMENT_TARGET_LINUX_{0}_TOKEN', env.ESTM_ENV)] }}"
          --out "$RUNNER_TEMP/estm-cred"

      - name: SSH - publicar e submeter em ${{ env.ESTM_ENV }}
        env:
          ESTM_KNOWN_HOSTS: ${{ vars.G_DEPLOYMENT_TARGET_LINUX_KNOWN_HOSTS }}
        run: >-
          python -m esteira_model_cob deploy ${{ steps.render.outputs.arquivos }}
          --env "$ESTM_ENV"
          --host "${{ vars[format('DEPLOY_SERVERS_{0}', env.ESTM_ENV)] }}"
          --user "${{ vars[format('G_DEPLOYMENT_TARGET_LINUX_{0}_USER', env.ESTM_ENV)] }}"
          --remote-dir "${{ vars[format('G_DEPLOYMENT_TARGET_{0}_PATH', env.ESTM_ENV)] }}"
          --known-hosts "$ESTM_KNOWN_HOSTS"
          --cred-dir "$RUNNER_TEMP/estm-cred"

      - name: Upload do JCL publicado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jcl-publicado-${{ env.ESTM_ENV }}
          path: build/
          if-no-files-found: ignore

      # Runner self-hosted e persistente: nada de credencial fica no disco.
      - name: Limpar credenciais
        if: always()
        run: rm -rf "$RUNNER_TEMP/estm-cred" && az logout || true
