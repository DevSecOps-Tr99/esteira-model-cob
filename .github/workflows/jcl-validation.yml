name: JCL Pipeline

on:
  pull_request:
    paths:
      - "jcl/**"
      - "proc/**"
      - "cobol/**"
      - "config/**"
      - "esteira_model_cob/**"
      - "tools/proleap-runner/**"
      - "tests/**"
  push:
    branches: [main, develop, "release/**", "hotfix/**"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar a esteira
        run: pip install -e ".[dev]"

      - name: Gitleaks - scan de segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java (para o wrapper do ProLeap)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # proleap-cobol-parser nao e publicado no Maven Central em nenhuma
      # versao - precisa ser compilado da fonte antes do pytest/mvn
      # conseguirem resolve-lo. Ver scripts/install_proleap.sh.
      - name: Instalar proleap-cobol-parser (nao esta no Maven Central)
        run: bash scripts/install_proleap.sh

      - name: Testes (pytest)
        run: pytest -q

      # continue-on-error: os 3 JCLs de demonstracao incluem de proposito um
      # cenario bloqueado (poc003) - o pytest acima ja testa esse bloqueio
      # via assert; estes dois passos sao a saida "ao vivo" da demo descrita
      # em docs/poc-demo.md, nao o gate de saude do repositorio.
      - name: Validar JCLs (Rules Engine + Quality Gate)
        continue-on-error: true
        run: python -m esteira_model_cob validate jcl/

      - name: Simular submissao (MockZosAdapter)
        continue-on-error: true
        run: python -m esteira_model_cob simulate jcl/

      - name: Gerar JCL Pipeline Report
        if: always()
        run: |
          for jcl in jcl/*.jcl; do
            python -m esteira_model_cob report "$jcl"
          done

      - name: Upload dos relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jcl-pipeline-reports
          path: reports/

  # Roda na VM de validacao (self-hosted, ver docs/ambiente-validacao.md).
  # So dispara em push (nao em PR) - promocao de ambiente acontece so
  # depois do merge, seguindo o mapeamento branch -> ambiente do
  # docs/gitflow.md e config/environments.yml.
  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64]
    environment: >-
      ${{
        github.ref_name == 'main' && 'PRD'
        || startsWith(github.ref_name, 'release/') && 'TI'
        || startsWith(github.ref_name, 'hotfix/') && 'PRD'
        || 'TU'
      }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar a esteira
        run: pip install -e ".[dev]"

      - name: Testes (pytest, com ProLeap real - java/mvn presentes na VM)
        run: pytest -q

      - name: Validar JCLs (Rules Engine + Quality Gate)
        continue-on-error: true
        run: python -m esteira_model_cob validate jcl/

      - name: Simular submissao (MockZosAdapter)
        continue-on-error: true
        run: python -m esteira_model_cob simulate jcl/

      - name: Gerar JCL Pipeline Report
        if: always()
        run: |
          for jcl in jcl/*.jcl; do
            python -m esteira_model_cob report "$jcl"
          done

      # "Publicacao" da POC: promove o commit validado para uma pasta
      # versionada na VM, representando o ambiente de destino - o
      # equivalente, nesta fase, a mover o membro para a PDS do ambiente
      # no fluxo atual. Fase 2 troca isso pela submissao real via z/OSMF.
      - name: Publicar artefatos validados no ambiente
        if: always()
        env:
          ESTM_ENV: >-
            ${{
              github.ref_name == 'main' && 'PRD'
              || startsWith(github.ref_name, 'release/') && 'TI'
              || startsWith(github.ref_name, 'hotfix/') && 'PRD'
              || 'TU'
            }}
        run: |
          set -euo pipefail
          DEST="$HOME/publicado/${ESTM_ENV}/${GITHUB_RUN_NUMBER}-${GITHUB_SHA::8}"
          mkdir -p "$DEST"
          cp -r jcl proc config reports "$DEST"/
          {
            echo "ambiente=${ESTM_ENV}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "autor=${GITHUB_ACTOR}"
            echo "run=${GITHUB_RUN_ID}"
            echo "publicado_em=$(date -u +%FT%TZ)"
          } > "$DEST/MANIFEST.txt"
          ln -sfn "$DEST" "$HOME/publicado/${ESTM_ENV}/latest"
          echo "Publicado em $DEST"
          cat "$DEST/MANIFEST.txt"

      - name: Upload dos relatorios (publicacao)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jcl-pipeline-reports-vm
          path: reports/
